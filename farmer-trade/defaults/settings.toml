# 默认设置（可在 DMCBK 设置界面覆盖）
[farmer-trade]
# 农作物箱坐标 "x,y,z"。留空 = 不取货，直接用背包材料
crop-chest = ""
# 出货箱坐标 "x,y,z"。留空 = 绿宝石留在背包
emerald-chest = ""
# 收购的农作物，如 "minecraft:wheat"。"auto" = 自动用箱子里最多的物品
crop-item = "auto"
# 找村民的半径（格）
villager-radius = 16.0
# 每批连续成交笔数（到量就歇，防涨价）
trades-per-batch = 4
# 两批之间的休息秒数（让需求回落）
rest-seconds = 60
# 累计存入的绿宝石达到该数量后停止，0 = 不限制
emerald-target = 0
# 最多循环批数，0 = 不限制
max-cycles = 0
# 每笔交易之间的延迟（毫秒）
delay-ms = 400
# 等待窗口打开的超时（毫秒）
open-timeout-ms = 5000
# 寻路到箱子的停止距离（格）
approach-distance = 2.5
